<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Copy Location：位置传递实验</title>
  <style>
    :root {
      --ink: #18181b;
      --ink-soft: #27272a;
      --ink-muted: #52525b;
      --caption: #71717a;
      --surface: #ffffff;
      --surface-muted: #f4f1e9;
      --surface-line: #d7dbe2;
      --accent-teal: #147d8f;
      --accent-orange: #f2b84b;
      --accent-mint: #6a7f2f;
      --accent-rose: #c44f37;
    }

    * { box-sizing: border-box; letter-spacing: 0; }
    html, body, #root { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink-soft);
      background: #f7f5ef;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
    }

    .title-serif {
      color: var(--ink);
      font-family: "New York", "Noto Serif SC", "Songti SC", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .lesson-title {
      color: #202124;
      font-family: inherit;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }

    .lesson-kicker {
      margin: 0 0 8px;
      color: #147d8f;
      font-size: 13px;
      font-weight: 760;
      line-height: 1.35;
    }

    .lesson-lede {
      max-width: 720px;
      margin: 10px 0 0;
      color: #62676f;
      font-size: 17px;
      line-height: 1.55;
    }

    .section-serif {
      color: var(--ink-muted);
      font-family: "New York", "Noto Serif SC", "Songti SC", Georgia, serif;
      font-size: 13px;
      font-weight: 760;
      line-height: 1.35;
    }

    .glass {
      border: 1px solid rgba(255,255,255,.72);
      background: rgba(255,255,255,.76);
      box-shadow: 0 1px 0 rgba(255,255,255,.72) inset, 0 20px 60px rgba(0,0,0,.065);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
    }

    .lesson-header {
      padding: 8px 4px 4px;
    }

    .scene-shell {
      position: relative;
      min-width: 0;
      height: 520px;
      overflow: hidden;
      border: 1px solid #d7dbe2;
      border-radius: 8px;
      background: #f4f1e9;
      box-shadow: 0 1px 0 rgba(255,255,255,.82) inset, 0 20px 60px rgba(24,24,27,.06);
    }

    #scene { display: block; width: 100%; height: 100%; }

    .scene-label {
      position: absolute;
      z-index: 3;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 8px;
      background: rgba(255,255,255,.74);
      color: #27272a;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
      transform: translate(-50%, -118%);
      backdrop-filter: blur(12px);
    }

    .label-target { border-color: rgba(242,184,75,.72); }
    .label-owner { border-color: rgba(98,103,111,.44); }
    .label-ghost { border-color: rgba(98,103,111,.42); color: #62676f; }
    .label-parent { border-color: rgba(98,103,111,.42); color: #62676f; }
    .label-desired { border-color: rgba(196,79,55,.62); color: #9f3f31; }

    .coach-panel {
      position: relative;
      overflow: hidden;
    }

    .coach-panel::before {
      content: "";
      position: absolute;
      top: 0;
      right: 24px;
      left: 24px;
      height: 3px;
      border-radius: 0 0 999px 999px;
      display: none;
    }

    .range-input { appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
    .range-input::-webkit-slider-runnable-track { height: 2px; border-radius: 999px; background: var(--surface-line); background: color-mix(in srgb, var(--range-color, var(--caption)) 44%, var(--surface-line)); }
    .range-input::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -5px; border: 0; border-radius: 50%; background: var(--range-color, var(--caption)); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--range-color, var(--caption)) 20%, transparent); transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 180ms ease; }
    .range-input:hover::-webkit-slider-thumb { transform: scale(1.3); box-shadow: 0 0 14px 4px rgba(161,161,170,.25); }
    .range-input::-moz-range-track { height: 2px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--range-color, var(--caption)) 44%, var(--surface-line)); }
    .range-input::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--range-color, var(--caption)); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--range-color, var(--caption)) 20%, transparent); }

    .enter-soft { animation: enter-soft 420ms cubic-bezier(.2,.8,.2,1) both; }
    @keyframes enter-soft { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (max-width: 860px) {
      .scene-shell { height: 410px; }
      .lesson-title { font-size: 28px; }
    }

    @media (max-width: 560px) {
      .scene-shell { height: 350px; border-radius: 8px; }
    }

    @media (min-width: 1024px) {
      .scene-shell { height: auto; min-height: 560px; }
      .coach-panel { min-height: 560px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../assets/vendor/tailwind-3.4.17.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#18181b",
            "ink-soft": "#27272a",
            "ink-muted": "#52525b",
            caption: "#71717a",
            surface: "#ffffff",
            "surface-muted": "#f4f4f5",
            "surface-line": "#e4e4e7",
            teal: "#147d8f",
            orange: "#f2b84b",
            rose: "#c44f37"
          }
        }
      }
    };
  </script>
  <script src="../assets/vendor/react-18.3.1.min.js"></script>
  <script src="../assets/vendor/react-dom-18.3.1.min.js"></script>
  <script src="../assets/vendor/three-0.185-orbit-controls.iife.js"></script>
  <script src="../assets/copy-location-learning-scene.js"></script>
  <script src="../assets/copy-location-learning-app.js"></script>
</body>
</html>
