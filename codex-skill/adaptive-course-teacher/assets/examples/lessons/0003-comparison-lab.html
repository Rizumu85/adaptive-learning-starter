<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Maintain Volume：体积补偿实验</title>
  <style>
    :root {
      --ink: #18181b; --ink-soft: #27272a; --ink-muted: #62676f; --caption: #71717a;
      --canvas: #f7f5ef; --surface: #fff; --stage: #f4f1e9; --line: #d7dbe2;
      --teal: #147d8f; --yellow: #f2b84b; --green: #6a7f2f; --red: #c44f37;
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink-soft); background: var(--canvas); font: 400 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .page { width: min(1152px, 100%); margin: 0 auto; padding: 32px 16px 48px; }
    .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin: 0 4px 24px; }
    .identity { min-width: 0; }
    .kicker { margin: 0 0 8px; color: var(--teal); font-size: 13px; font-weight: 760; }
    h1 { margin: 0; color: #202124; font-size: 34px; line-height: 1.1; }
    .lede { max-width: 720px; margin: 10px 0 0; color: var(--ink-muted); font-size: 17px; }
    .progress { width: 260px; flex: 0 0 260px; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--caption); font-size: 13px; }
    .progress-track { height: 3px; overflow: hidden; border-radius: 999px; background: var(--line); }
    .progress-fill { width: 25%; height: 100%; border-radius: inherit; background: var(--teal); transition: width 300ms ease; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: stretch; }
    .stage-shell, .panel { height: 760px; min-height: 760px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 14px 40px rgba(32,33,36,.08); }
    .stage-shell { position: relative; background: var(--stage); }
    #scene { display: block; width: 100%; height: 100%; }
    .stage-status { position: absolute; top: 16px; left: 16px; z-index: 2; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 8px 12px; border: 1px solid rgba(255,255,255,.8); border-radius: 8px; background: rgba(255,255,255,.78); font-size: 13px; }
    .dot { width: 5px; height: 5px; flex: 0 0 5px; border-radius: 50%; background: var(--teal); }
    .axis-legend { position: absolute; right: 16px; bottom: 16px; z-index: 2; display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.78); color: var(--caption); font-size: 12px; }
    .axis-legend[hidden] { display: none; }
    .axis-legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 5px; border-radius: 99px; vertical-align: 3px; }
    .axis-x::before { background: var(--red); } .axis-y::before { background: var(--teal); } .axis-z::before { background: var(--green); }
    .compare-labels { position: absolute; top: 70px; left: 7%; right: 7%; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; pointer-events: none; }
    .compare-labels[hidden] { display: none; }
    .mode-label { justify-self: center; min-width: 112px; padding: 7px 9px; border: 1px solid rgba(98,103,111,.28); border-radius: 7px; background: rgba(255,255,255,.82); text-align: center; }
    .mode-label b, .mode-label span { display: block; }
    .mode-label b { color: var(--ink); font-size: 13px; }
    .mode-label span { margin-top: 1px; color: var(--ink-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .mode-label.preserved { border-color: rgba(20,125,143,.48); }
    .mode-label.preserved span { color: var(--teal); }
    .mode-label .axis-action { margin-top: 5px; padding-top: 4px; border-top: 1px solid rgba(215,219,226,.72); color: var(--ink-muted); font-size: 10px; white-space: nowrap; }
    .axis-action em { margin: 0 3px; color: var(--caption); font-style: normal; }
    .axis-token { display: inline-block; min-width: 14px; margin-left: 2px; padding: 0 2px; border-bottom: 2px solid currentColor; font-style: normal; font-weight: 700; line-height: 1.35; }
    .axis-token.axis-x { color: var(--red); }
    .axis-token.axis-y { color: var(--teal); }
    .axis-token.axis-z { color: var(--green); }
    .panel { display: flex; flex-direction: column; }
    .panel-body { flex: 1; padding: 28px 28px 22px; }
    .eyebrow { margin: 0 0 8px; color: #52525b; font: 760 13px/1.35 "New York", "Noto Serif SC", "Songti SC", Georgia, serif; }
    h2 { margin: 0 0 12px; color: var(--ink); font: 700 22px/1.25 "New York", "Noto Serif SC", "Songti SC", Georgia, serif; }
    .step-copy { margin: 0; }
    .rule { height: 1px; margin: 20px 0; background: rgba(215,219,226,.72); }
    .control-label { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
    .control-gap { height: 16px; }
    .segmented { --count: 3; position: relative; display: grid; grid-template-columns: repeat(var(--count), 1fr); padding: 4px; border-radius: 8px; background: #f4f4f5; }
    .segment-capsule { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--count)); border: 1px solid var(--teal); border-radius: 6px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,.04); transform: translateX(calc(var(--index, 0) * 100%)); transition: transform 300ms cubic-bezier(.2,.8,.2,1); }
    .segmented[data-index="0"] { --index: 0; } .segmented[data-index="1"] { --index: 1; } .segmented[data-index="2"] { --index: 2; }
    .segment { position: relative; z-index: 1; min-width: 0; min-height: 44px; padding: 6px 3px; border: 0; background: transparent; cursor: pointer; }
    .segment strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .modes .segment strong { font-size: 12px; }
    .range-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 14px; }
    .range-value { color: var(--teal); font-variant-numeric: tabular-nums; }
    .range-actions { display: flex; align-items: center; gap: 8px; }
    .range-reset { padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink-muted); font-size: 12px; cursor: pointer; }
    .range-reset:hover:not(:disabled) { border-color: rgba(20,125,143,.45); color: var(--teal); }
    .range-reset:disabled { opacity: .38; cursor: default; }
    input[type="range"] {
      width: 100%; height: 24px; margin: 0;
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      border: 0; outline: 0; cursor: pointer;
      background: linear-gradient(var(--teal), var(--teal)) center / 100% 2px no-repeat;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; border: 0; border-radius: 99px; background: transparent; }
    input[type="range"]::-webkit-slider-thumb { width: 13px; height: 13px; margin-top: -5.5px; -webkit-appearance: none; appearance: none; border: 0; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px var(--surface); }
    input[type="range"]::-moz-range-track { height: 2px; border: 0; border-radius: 99px; background: transparent; }
    input[type="range"]::-moz-range-progress { height: 2px; border-radius: 99px; background: var(--teal); }
    input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px var(--surface); }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(20,125,143,.24); }
    input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(20,125,143,.24); }
    .metric { display: grid; gap: 4px; margin-top: 14px; padding: 10px 11px; border-radius: 7px; background: #f4f4f5; font-size: 13px; font-variant-numeric: tabular-nums; }
    .metric b { color: var(--ink); }
    .feedback { display: flex; gap: 9px; margin-top: 12px; padding: 12px 13px; border: 1px solid rgba(20,125,143,.25); border-radius: 8px; background: #eef5f6; font-size: 14px; }
    .feedback .dot { margin-top: 7px; }
    .feedback.warning { border-color: rgba(196,79,55,.28); background: #fff4f1; }
    .feedback.warning .dot { background: var(--red); }
    .operation-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .operation { min-height: 38px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 13px; cursor: pointer; }
    .operation.active { border-color: var(--teal); background: #f5fafb; }
    .trigger-key { display: grid; gap: 4px; margin-bottom: 14px; padding: 9px 10px; border-left: 3px solid var(--teal); background: #f4f4f5; color: var(--ink-muted); font-size: 12px; }
    .trigger-key b { color: var(--ink); font-weight: 650; }
    .mode-table { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13px; }
    .mode-row { display: grid; grid-template-columns: 88px 1fr; gap: 8px; padding: 10px 11px; border-top: 1px solid var(--line); }
    .mode-row:first-child { border-top: 0; }
    .mode-row.head { background: #f4f4f5; color: var(--caption); font-size: 12px; }
    .mode-row.recommended { background: #f5fafb; }
    .recall { display: grid; gap: 4px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 14px; }
    .recall b { color: var(--ink); }
    .panel-nav { display: flex; align-items: center; gap: 8px; padding: 20px 28px; border-top: 1px solid rgba(215,219,226,.72); }
    .button { min-height: 38px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; transition: transform 180ms ease, box-shadow 180ms ease; }
    .button:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.04); }
    .button:active { transform: scale(.97); }
    .button:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
    .next { margin-left: auto; }
    .next::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 6px; border-radius: 50%; background: var(--teal); vertical-align: 2px; }
    @media (max-width: 860px) {
      .page { padding-top: 24px; }
      .header { align-items: flex-start; flex-direction: column; }
      .progress { width: 100%; max-width: 260px; flex-basis: auto; }
      h1 { font-size: 28px; }
      .workspace { grid-template-columns: 1fr; }
      .stage-shell { height: 390px; min-height: 390px; }
      .panel { height: auto; min-height: 0; }
    }
    @media (max-width: 420px) {
      .panel-body { padding: 24px 22px 20px; }
      .panel-nav { padding: 18px 22px; }
      .axis-legend { right: 10px; bottom: 10px; }
      .compare-labels { left: 8px; right: 8px; gap: 4px; }
      .mode-label { width: 100%; min-width: 0; padding: 6px 3px; }
      .mode-label b { font-size: 12px; }
      .mode-label span { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="identity">
        <p class="kicker">02 17 · BLENDER RIGGING / TRANSFORM CONSTRAINTS</p>
        <h1>Maintain Volume：体积补偿实验</h1>
        <p class="lede">Maintain Volume 的 Free Axis 与三种 Mode，决定缩放时由哪些轴补偿体积。</p>
      </div>
      <div class="progress" aria-label="课程进度">
        <div class="progress-copy"><span id="progress-number">1 / 4</span><span>看 · 试 · 分 · 选</span></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </header>
    <div class="workspace">
      <section class="stage-shell">
        <canvas id="scene" aria-label="Maintain Volume 三维体积补偿演示"></canvas>
        <div class="stage-status"><span class="dot"></span><span id="stage-status">拉长 Y，观察 X 与 Z</span></div>
        <div class="axis-legend" id="axis-legend"><span class="axis-x">X</span><span class="axis-y">Y</span><span class="axis-z">Z</span></div>
        <div class="compare-labels" id="compare-labels" hidden>
          <div class="mode-label" id="mode-strict"><b>Strict</b><span id="volume-strict">体积 1.00</span><span class="axis-action" id="axes-strict"></span></div>
          <div class="mode-label" id="mode-uniform"><b>Uniform</b><span id="volume-uniform">体积 1.00</span><span class="axis-action" id="axes-uniform"></span></div>
          <div class="mode-label" id="mode-single"><b>Single Axis</b><span id="volume-single">体积 1.00</span><span class="axis-action" id="axes-single"></span></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-body" id="panel-body"></div>
        <nav class="panel-nav">
          <button class="button" id="back" type="button">返回</button>
          <button class="button next" id="next" type="button">下一步：Free Axis</button>
        </nav>
      </section>
    </div>
  </main>
  <script src="../assets/vendor/three-0.185-orbit-controls.iife.js"></script>
  <script src="../assets/maintain-volume-scene.js"></script>
  <script src="../assets/maintain-volume-app.js"></script>
</body>
</html>
