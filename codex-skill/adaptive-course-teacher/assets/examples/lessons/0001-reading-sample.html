<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读型课件样本</title>
  <link rel="stylesheet" href="../assets/course.css">
</head>
<body>
  <main class="page">
    <div class="kicker">LEARNING SYSTEM / READING SAMPLE</div>
    <h1>先知道要看什么，再开始学习</h1>
    <p class="intro">观看前地图不是视频摘要。它只标出最终结果、关键转折和可以略看的部分，给注意力一个稳定方向。</p>

    <section class="route" aria-label="阅读路线">
      <div><span class="num">1</span><span><h2>先认出结果</h2><p>结束时应该能辨认哪种状态、作品或操作。</p></span></div>
      <div><span class="num">2</span><span><h2>只追踪关键关系</h2><p>先保住因果关系，术语和细节可以稍后补齐。</p></span></div>
      <div><span class="num">3</span><span><h2>看完重新建立推理</h2><p>用自己的话说明为什么这样做，而不是复述按钮顺序。</p></span></div>
    </section>

    <section class="figure">
      <h2>摘要和观看地图的区别</h2>
      <div class="comparison">
        <div class="state warm"><strong>摘要</strong>告诉你视频依次说了什么。</div>
        <div class="state"><strong>观看地图</strong>告诉你注意力应该停在哪里。</div>
      </div>
    </section>
  </main>
</body>
</html>
